services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_TOKEN_FILE: /app/secrets/token.json
      MMVH_RUNTIME_CONFIG: /app/secrets/runtime.json
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/mmvh-front-desk
    volumes:
      - ./secrets:/app/secrets
    depends_on:
      - n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Phoenix
      TZ: America/Phoenix
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SSRF_PROTECTION_ENABLED: "true"
      N8N_SSRF_ALLOWED_HOSTNAMES: "app"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
